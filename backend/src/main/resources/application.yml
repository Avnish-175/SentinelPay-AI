server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sentinelpay-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentinelpay}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

ml:
  engine:
    base-url: ${ML_ENGINE_URL:http://localhost:8000}
    timeout-ms: ${ML_ENGINE_TIMEOUT_MS:5000}

logging:
  level:
    com.sentinelpay: INFO
    org.springframework.web: INFO
